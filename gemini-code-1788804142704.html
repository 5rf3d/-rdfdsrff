<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rdfdsrff | Ideas • Tecnología • Futuro</title>
    <style>
        :root {
            --bg-color: #030812;
            --accent-blue: #00d2ff;
            --text-main: #ffffff;
            --text-sub: #7a8b9e;
            --glow-color: rgba(0, 210, 255, 0.25);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Tech circuit background effect */
        .bg-glow {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, var(--glow-color) 0%, rgba(3,8,18,0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
            pointer-events: none;
        }

        .container {
            text-align: center;
            z-index: 2;
            padding: 20px;
        }

        .brand-title {
            font-size: 5rem;
            font-weight: 800;
            letter-spacing: -2px;
            margin-bottom: 10px;
            color: var(--text-main);
        }

        .brand-title span {
            color: var(--accent-blue);
        }

        .slogan {
            font-size: 1.1rem;
            letter-spacing: 6px;
            color: var(--text-sub);
            text-transform: uppercase;
            font-weight: 500;
            margin-bottom: 30px;
        }

        .slogan span {
            color: var(--accent-blue);
            margin: 0 10px;
        }

        .status-badge {
            display: inline-block;
            padding: 8px 18px;
            border: 1px solid rgba(0, 210, 255, 0.4);
            border-radius: 20px;
            background: rgba(0, 210, 255, 0.05);
            font-size: 0.85rem;
            letter-spacing: 1px;
            color: var(--accent-blue);
        }

        footer {
            position: absolute;
            bottom: 20px;
            font-size: 0.8rem;
            color: var(--text-sub);
            z-index: 2;
        }
    </style>
</head>
<body>
    <div class="bg-glow"></div>
    
    <main class="container">
        <h1 class="brand-title">rdfdsr<span>ff</span></h1>
        <p class="slogan">IDEAS <span>/</span> TECNOLOGÍA <span>/</span> FUTURO</p>
        <div class="status-badge">SISTEMA SEGURO Y ACTIVO</div>
    </main>

    <footer>
        &copy; 2026 rdfdsrff. Todos los derechos reservados.
    </footer>
</body>
</html>
